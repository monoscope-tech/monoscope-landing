<section data-screen="issues" data-src="screens-ipad/issues-errors.html"></section>
<section data-screen="issue"  data-src="screens-ipad/issue-trace.html"></section>

<script type="application/json" data-storyboard>
[
  { "screen": "issues", "wait": 1800 },
  { "cursor": "a[href*='bf0881c3']", "click": true, "wait": 100 },

  { "cursor": "a[href='#issue-trace']", "click": true, "wait": 100 },
  { "scroll": "details:has(#trace_span_container)", "wait": 3000 }
]
