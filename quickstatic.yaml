# The session every /for/<agent>/ page plays in that agent's own chrome (components/agent-terminal.liquid).
# Rows: user | tool (+args, out) | read | say. Inline <span class=y> marks the evidence.
agent_session:
  - user: "orders have been stuck in processing since this morning. did Acme change something?"
  - tool: search_events
    args: 'query: "attributes.url.full has \"api.acme-logistics.com\"", since: "12h"'
    out:
      - "41 calls to POST /v1/shipments since 07:52, all 200 OK"
      - 'response body: {"status":"acknowledged","shipment_id":"shp_8812"}'
      - "tracking_id missing in 41 of 41, present in every response before 07:52"
  - tool: list_issues
    args: 'status: "open"'
    out:
      - "API change · acme-logistics POST /v1/shipments · tracking_id removed · critical"
  - read: src/shipments/advance.ts
  - say: 'Acme stopped returning <span class="y">tracking_id</span> at 07:52. Every call since still gets 200 OK with status "acknowledged", so nothing errored and no alert fired. <span class="y">advance.ts:42</span> needs tracking_id to mark an order shipped, which leaves 41 orders in processing. Your last deploy was two days ago; the stored responses put the change on Acme''s side.'
  - say: "Want me to fall back to looking the shipment up by shipment_id?"

