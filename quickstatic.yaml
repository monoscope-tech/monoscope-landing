docs_main_pages:
  - title: Onboarding
    slug: /docs/onboarding
    icon: circle-play

  - title: SDK Guides
    slug: /docs/sdks
    icon: plug

  - title: Product Guide
    slug: /docs/dashboard
    icon: chart-line

  - title: API Reference
    slug: /docs/api-reference
    icon: code

main_nav:
  - title: Product
    dropdown:
      - title: AI SRE
        url: /features/ai-sre/
        sprite: zap
        description: Investigates errors, answers in Slack and opens the fix
      - title: Error tracking
        url: /features/error-tracking/
        sprite: bug
        description: Every error and crash, with the request that caused it
      - title: API monitoring
        url: /features/api-monitoring/
        sprite: plug
        description: Calls in and out, with bodies and breaking changes
      - title: Logs & traces
        url: /features/logs-and-traces/
        sprite: align-left
        description: Search every log, span and request, never sampled
      - title: Metrics & dashboards
        url: /features/dashboards/
        sprite: bar-chart
        description: Dashboards, metrics and alerts on any query
      - title: Session replay
        url: /features/session-replay/
        sprite: circle-play
        description: What the customer saw, next to the failing request
      - title: Your own bucket
        url: /features/byob-s3/
        sprite: database
        description: All your data as open Parquet in your S3
  - title: Documentation
    dropdown:
      - title: Get Started
        url: /docs/onboarding
        sprite: rocket
        description: All you need to start using monoscope
      - title: SDK Guides
        url: /docs/sdks
        sprite: code
        description: Integrate any of the SDKs into your application
      - title: Platform Guides
        url: /docs/dashboard
        sprite: layout
        description: Learn everything you need to navigate the platform
  - title: Blog
    url: /blog
  - title: Changelog
    url: /changelog
  - title: Pricing
    url: /pricing
